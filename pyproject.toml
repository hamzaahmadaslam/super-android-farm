[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superfarm"
version = "0.1.0"
description = "Super Farm: a GPU-accelerated Android container farm for Linux with per-device VPNs, fleet control and app automation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["android", "redroid", "farm", "automation", "docker", "vpn", "adb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Emulators",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Persistent UI-hierarchy reader for screens that never go idle (video, animations).
u2 = ["uiautomator2>=3.2"]
# MCP server (`sf mcp`): lets MCP-enabled AI assistants see and operate the farm. See docs/MCP.md.
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sf = "superfarm.cli.main:main"
superfarm = "superfarm.cli.main:main"

[tool.setuptools.packages.find]
include = ["superfarm*"]

[tool.setuptools.package-data]
superfarm = ["web/**/*", "data/**/*"]

# Dockerfiles, unit templates, helper scripts and native sources live outside the package
# folder; a wheel carries them as data files and superfarm.resources finds them again.
# One line per folder (data files are not copied recursively); a unit test fails when a
# folder under deploy/, scripts/ or native/ is missing here.
[tool.setuptools.data-files]
"share/superfarm-resources/deploy/docker/android" = ["deploy/docker/android/*"]
"share/superfarm-resources/deploy/docker/net" = ["deploy/docker/net/*"]
"share/superfarm-resources/deploy/systemd" = ["deploy/systemd/*"]
"share/superfarm-resources/scripts/camera" = ["scripts/camera/*"]
"share/superfarm-resources/scripts/host" = ["scripts/host/*"]
"share/superfarm-resources/native/camera" = ["native/camera/*"]
"share/superfarm-resources/native/v4l2loopback" = ["native/v4l2loopback/*"]
"share/superfarm-resources/native/venus" = ["native/venus/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["live: needs Docker and a real Android container (set SF_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E501", "S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
