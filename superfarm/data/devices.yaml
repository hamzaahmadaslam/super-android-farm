# Device presets: what an Android reports about itself (Build.BRAND, Build.MODEL, ...).
#
# `sf device profiles` lists them; `device.profile` in config.yaml (or per instance) picks one,
# `random` draws one per new Android, `none` keeps the image's own identity.
#
# Rules for this file
#   * No whitespace in any value. The Android container receives these as boot arguments and
#     splits its command line on spaces: "Pixel 7" arrives as model "Pixel" plus a stray "7".
#     That is why phones whose model name contains a space (Pixel, moto, Nokia ...) are absent.
#   * brand / manufacturer / model / device / name map to ro.product.<key>.
#   * screen is the phone's native panel (pixels, density). A farm does not render at that size:
#     `profile_screen()` scales it to a chosen width, keeping the aspect ratio and the
#     density-independent width, so layouts look like the phone's at a fraction of the cost.
#   * Values are the commonly published ones for the international variant. They are a
#     plausible identity, not a guarantee of matching one exact retail firmware.

samsung-s23-ultra:
  label: Samsung Galaxy S23 Ultra
  brand: samsung
  manufacturer: samsung
  model: SM-S918B
  device: dm3q
  name: dm3qxxx
  screen: {width: 1440, height: 3088, dpi: 600}

